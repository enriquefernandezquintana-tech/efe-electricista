<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Presupuesto · Enrique Fernández Electricista</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;margin:0;color:#111827}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #00000010}.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#6b7280}.total{font-size:28px;font-weight:800}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}.yes{background:#111827;color:white}.no{background:#eee}.hidden{display:none}.error{color:#b91c1c}</style></head><body><div class="wrap"><div id="loading" class="card">Cargando presupuesto…</div><div id="content" class="hidden"><div class="card"><h1 id="business"></h1><p class="muted" id="meta"></p><h2 id="number"></h2><p id="notes"></p></div><div class="card"><h3>Detalle</h3><div id="items"></div><div class="row"><span>Base imponible</span><b id="subtotal"></b></div><div class="row"><span>IVA</span><b id="vat"></b></div><div class="row"><span>Total</span><b class="total" id="total"></b></div><button class="btn yes" id="accept">✓ Aceptar presupuesto</button><button class="btn no" id="reject">Rechazar</button><p class="muted">No necesitas crear una cuenta para responder.</p><p id="result"></p></div></div><div id="error" class="card hidden error"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://whnqdzftjjowugmknzcd.supabase.co',KEY='sb_publishable_AL0ZIUPNHRw2HEyVn9uhdQ_9C1eQLeN',db=supabase.createClient(URL,KEY),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0),t=new URLSearchParams(location.search).get('t');let quoteToken=t;async function load(){if(!t)return fail('Enlace de presupuesto incompleto.');const r=await db.rpc('get_public_quote',{p_token:t});if(r.error||!r.data)return fail('Este presupuesto no está disponible o ha caducado.');const d=r.data,q=d.quote,b=d.business;document.title='Presupuesto '+q.number+' · '+b.name;document.getElementById('business').textContent=b.name||'Presupuesto';document.getElementById('meta').textContent=[b.phone,b.email,b.address].filter(Boolean).join(' · ');document.getElementById('number').textContent='Presupuesto '+q.number;document.getElementById('notes').textContent=q.notes||'';document.getElementById('items').innerHTML=(d.items||[]).map(i=>`<div class="row"><span>${i.description} × ${i.quantity}</span><b>${money(i.line_total)}</b></div>`).join('');document.getElementById('subtotal').textContent=money(q.subtotal);document.getElementById('vat').textContent=money(q.vat_total);document.getElementById('total').textContent=money(q.total);if(q.status!=='sent'){document.getElementById('accept').disabled=true;document.getElementById('reject').disabled=true;document.getElementById('result').textContent='Este presupuesto ya tiene una respuesta: '+q.status;}document.getElementById('loading').classList.add('hidden');document.getElementById('content').classList.remove('hidden')}function fail(x){document.getElementById('loading').classList.add('hidden');document.getElementById('error').textContent=x;document.getElementById('error').classList.remove('hidden')}async function respond(dec){const r=await db.rpc('respond_public_quote',{p_token:quoteToken,p_decision:dec});if(r.error)return document.getElementById('result').textContent='No se pudo registrar la respuesta.';document.getElementById('accept').disabled=true;document.getElementById('reject').disabled=true;document.getElementById('result').textContent=dec==='accepted'?'✓ Presupuesto aceptado. Gracias.':'Presupuesto rechazado. Gracias por avisar.'}document.getElementById('accept').onclick=()=>respond('accepted');document.getElementById('reject').onclick=()=>respond('rejected');load();</script></body></html>
