<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Solicitar servicio · Enrique Fernández Electricista</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:520px;margin:auto"><div class="card"><div class="brand">⚡ ENRIQUE FERNÁNDEZ</div><h1>Solicitar servicio</h1><p class="muted">Cuéntanos qué necesitas y nos pondremos en contacto contigo.</p><label>Nombre<input id="name"></label><label>Teléfono<input id="phone" type="tel"></label><label>Email<input id="email" type="email"></label><label>Dirección<input id="address"></label><label>¿Qué necesitas?<textarea id="description" rows="5"></textarea></label><label>Fecha preferida<input id="date" type="date"></label><button class="primary wide" id="send">Enviar solicitud</button><p id="msg" class="muted"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://whnqdzftjjowugmknzcd.supabase.co','sb_publishable_AL0ZIUPNHRw2HEyVn9uhdQ_9C1eQLeN');const slug='enrique-fernandez-electricista';let businessId=null;async function init(){const r=await db.from('businesses').select('id').eq('public_slug',slug).single();if(r.error){msg.textContent='No se ha podido cargar el formulario.';return}businessId=r.data.id}const msg=t=>document.getElementById('msg').textContent=t;document.getElementById('send').onclick=async()=>{const name=document.getElementById('name').value.trim(),description=document.getElementById('description').value.trim();if(name.length<2||description.length<5){msg('Indica tu nombre y explica brevemente la avería o trabajo.');return}const r=await db.from('service_requests').insert({business_id:businessId,name,phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim(),description,preferred_date:document.getElementById('date').value||null,status:'new'});if(r.error)msg(r.error.message);else{msg('Solicitud enviada correctamente. Te contactaremos lo antes posible.');['name','phone','email','address','description','date'].forEach(id=>document.getElementById(id).value='')}};init();</script></body></html>
